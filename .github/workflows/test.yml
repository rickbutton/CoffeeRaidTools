name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  busted:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua, busted, svn
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks subversion
          sudo luarocks --lua-version=5.1 install busted

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Make packager executable
        run: chmod +x scripts/package.sh

      - run: pnpm test
